<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>거창시장 가격표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&family=Noto+Sans+Khmer:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f5eee1;
    --card: #fffaf0;
    --card2: #fdf6e9;
    --ink: #2e2118;
    --ink-soft: #7a6a58;
    --ink-faint: #a4937e;
    --line: #e6d9c3;
    --line-soft: #efe5d2;
    --accent: #c2401d;
    --accent-ink: #a33517;
    --accent-soft: #f8e5db;
    --stamp: #c2401d;
    --chip: #f0e6d2;
    --shadow: 0 1px 2px rgba(72,52,30,.06), 0 6px 18px rgba(72,52,30,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #201810; --card: #2b221a; --card2: #332920;
      --ink: #f2e8d8; --ink-soft: #bfae99; --ink-faint: #8d7c67;
      --line: #443628; --line-soft: #3a2e22;
      --accent: #ea6a3e; --accent-ink: #f08054; --accent-soft: #45281c;
      --stamp: #ea6a3e; --chip: #3c3125;
      --shadow: 0 1px 2px rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #201810; --card: #2b221a; --card2: #332920;
    --ink: #f2e8d8; --ink-soft: #bfae99; --ink-faint: #8d7c67;
    --line: #443628; --line-soft: #3a2e22;
    --accent: #ea6a3e; --accent-ink: #f08054; --accent-soft: #45281c;
    --stamp: #ea6a3e; --chip: #3c3125;
    --shadow: 0 1px 2px rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; }
  html { font-size: 17px; } html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", "Noto Sans Thai", "Noto Sans Khmer", "Apple SD Gothic Neo", "Malgun Gothic", "Leelawadee UI", sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: "Noto Serif KR", "Apple SD Gothic Neo", serif; }

  .wrap { max-width: 520px; margin: 0 auto; padding: 0 14px 56px; }

  .demo-ribbon {
    background: var(--ink); color: var(--bg); text-align: center;
    font-size: .72rem; letter-spacing: .02em; padding: 6px 10px;
  }

  .langbar {
    position: sticky; top: 0; z-index: 20; background: var(--bg);
    padding: 10px 0 8px; border-bottom: 1px solid var(--line-soft); margin-bottom: 4px;
  }
  .langbar-in { max-width: 480px; margin: 0 auto; padding: 0 16px; display: flex; gap: 5px; }
  .langbtn {
    flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
    border-radius: 999px; padding: 7px 0; font-size: .74rem; font-weight: 500;
    font-family: inherit; cursor: pointer; white-space: nowrap;
  }
  .langbtn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 700; }

  .brandbar { max-width: 520px; margin: 0 auto; padding: 14px 14px 0; text-align: center; }
  .brandbar img { max-width: 230px; width: 62%; height: auto; background: #fff; border-radius: 12px; padding: 9px 16px; box-shadow: var(--shadow); }

  .masthead { text-align: center; padding: 26px 0 6px; }
  .masthead .mk-sub {
    font-size: .72rem; letter-spacing: .28em; color: var(--accent);
    text-transform: uppercase; font-weight: 700; margin-bottom: 6px;
  }
  .masthead h1 { font-size: 1.6rem; margin: 0; font-weight: 900; letter-spacing: .02em; }
  .masthead .mk-en { font-size: .8rem; color: var(--ink-soft); margin-top: 4px; }
  .mast-rule { display: flex; align-items: center; gap: 10px; margin: 16px 0 20px; color: var(--ink-faint); font-size: .8rem; }
  .mast-rule::before, .mast-rule::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }

  .lead { font-size: .86rem; color: var(--ink-soft); text-align: center; margin: 0 8px 20px; }

  .shopcard {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 13px 16px; margin-bottom: 10px;
    text-decoration: none; color: inherit; box-shadow: var(--shadow);
  }
  .stamp {
    flex: none; width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid var(--stamp); color: var(--stamp);
    display: flex; align-items: center; justify-content: center;
    font-family: "Noto Serif KR", serif; font-weight: 900; font-size: 1rem;
    transform: rotate(-6deg);
  }
  .shopcard .sc-body { flex: 1; min-width: 0; }
  .shopcard .sc-name { font-weight: 700; font-size: 1rem; }
  .shopcard .sc-name small { display: block; font-weight: 400; font-size: .74rem; color: var(--ink-soft); }
  .shopcard .sc-cat { font-size: .72rem; color: var(--accent-ink); font-weight: 500; margin-top: 2px; }
  .shopcard .sc-arrow { color: var(--ink-faint); font-size: 1.1rem; }

  .sechead { display: flex; align-items: center; gap: 10px; margin: 34px 0 14px; font-weight: 700; font-size: .95rem; }
  .sechead::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }
  .sechead .no { color: var(--accent); font-family: "Noto Serif KR", serif; }

  .qr-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .qr-sticker {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 8px 10px; text-align: center; box-shadow: var(--shadow);
  }
  .qr-sticker .qr-top { font-size: .6rem; letter-spacing: .14em; color: var(--accent); font-weight: 700; margin-bottom: 6px; }
  .qr-sticker img { width: 100%; max-width: 92px; aspect-ratio: 1; border-radius: 6px; background: #fff; display: inline-block; }
  .qr-sticker .qr-name { font-size: .74rem; font-weight: 700; margin-top: 7px; line-height: 1.3; word-break: keep-all; }
  .qr-sticker .qr-hint { font-size: .6rem; color: var(--ink-soft); margin-top: 2px; }
  .qr-note { font-size: .78rem; color: var(--ink-soft); margin: 12px 4px 0; text-align: center; }

  .how { display: flex; flex-direction: column; gap: 8px; }
  .how-step {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--card2); border: 1px solid var(--line-soft); border-radius: 12px; padding: 12px 14px;
  }
  .how-step .hs-n {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    background: var(--ink); color: var(--bg); font-size: .72rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center; margin-top: 2px;
  }
  .how-step .hs-t { font-size: .84rem; }
  .how-step .hs-t b { display: block; font-size: .87rem; }
  .how-step .hs-t span { color: var(--ink-soft); font-size: .78rem; }

  /* shop page */
  .backlink {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--ink-soft); text-decoration: none; font-size: .82rem; margin: 16px 0 4px; font-weight: 500;
  }
  .shop-head { text-align: center; padding: 18px 0 4px; }
  .shop-head .stamp { margin: 0 auto 12px; width: 52px; height: 52px; font-size: 1.15rem; }
  .shop-head h1 { margin: 0; font-size: 1.5rem; font-weight: 900; word-break: keep-all; }
  .shop-head .sh-alt { color: var(--ink-soft); font-size: .86rem; margin-top: 2px; }
  .shop-head .sh-cat {
    display: inline-block; margin-top: 10px; background: var(--accent-soft); color: var(--accent-ink);
    font-size: .72rem; font-weight: 700; padding: 4px 12px; border-radius: 999px;
  }

  .menu-paper {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow); padding: 20px 18px 14px; margin-top: 18px;
  }
  .menu-title {
    text-align: center; font-family: "Noto Serif KR", "Noto Sans Thai", "Noto Sans Khmer", serif; font-weight: 700;
    font-size: .92rem; letter-spacing: .12em; color: var(--ink);
    display: flex; align-items: center; gap: 12px; margin: 18px 0 4px;
  }
  .menu-title:first-child { margin-top: 0; }
  .menu-title::before, .menu-title::after { content: ""; flex: 1; border-top: 2px solid var(--ink); opacity: .7; }

  .mi { padding: 12px 2px 11px; border-bottom: 1px dashed var(--line); }
  .mi:last-child { border-bottom: 0; }
  .mi-row { display: flex; align-items: baseline; gap: 8px; }
  .mi-name { font-weight: 700; font-size: .96rem; word-break: keep-all; }
  .mi-dots { flex: 1; border-bottom: 2px dotted var(--line); min-width: 16px; transform: translateY(-4px); }
  .mi-price { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mi-ko { font-size: .74rem; color: var(--ink-faint); margin-top: 2px; }
  .mi-tag { font-size: .76rem; color: var(--ink-soft); margin-top: 3px; }
  .mi-size { display: flex; align-items: baseline; gap: 8px; padding: 3px 0 0 14px; }
  .mi-size .sz { font-size: .82rem; color: var(--ink-soft); font-weight: 500; }

  .paper-notes { margin-top: 14px; border-top: 1px solid var(--line-soft); padding-top: 10px; }
  .paper-notes li { font-size: .76rem; color: var(--ink-soft); margin-left: -18px; margin-bottom: 2px; }
  .order-hint {
    margin-top: 12px; background: var(--accent-soft); color: var(--accent-ink);
    border-radius: 10px; font-size: .76rem; padding: 8px 12px; font-weight: 500;
  }

  footer { text-align: center; margin-top: 30px; color: var(--ink-faint); font-size: .72rem; line-height: 1.7; }
  footer .f-market { font-family: "Noto Serif KR", serif; font-weight: 700; color: var(--ink-soft); }
</style>
</head>

/* ================= STATE ================= */
let lang = "ko";
try {
  const saved = localStorage.getItem("gc-lang");
  if (saved && UI[saved]) lang = saved;
  else {
    const nav = (navigator.language || "").toLowerCase();
    if (nav.startsWith("en")) lang = "en";
    else if (nav.startsWith("vi")) lang = "vi";
    else if (nav.startsWith("th")) lang = "th";
    else if (nav.startsWith("km")) lang = "km";
  }
} catch (e) {}

const t = () => UI[lang];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const won = (n) => (lang === "ko" ? n.toLocaleString("ko-KR") + "원" : "₩" + n.toLocaleString("en-US"));
const trName = (ko) => (lang === "ko" ? ko : (TR[ko] ? TR[ko][IDX[lang]] : ko));
const trSec = (ko) => (lang === "ko" ? ko : (SEC[ko] ? SEC[ko][IDX[lang]] : ko));
const trSz = (ko) => (lang === "ko" ? ko : (SZ[ko] ? SZ[ko][IDX[lang]] : ko));

/* ================= RENDER ================= */
function renderLangbar() {
  document.getElementById("langbar").innerHTML = LANGS.map(
    (l) => `<button class="langbtn" aria-pressed="${l.code === lang}" onclick="setLang('${l.code}')">${l.label}</button>`
  ).join("");
}

function setLang(code) {
  lang = code;
  try { localStorage.setItem("gc-lang", code); } catch (e) {}
  document.documentElement.setAttribute("lang", code);
  render();
}

function itemHtml(m) {
  const name = trName(m.ko);
  let rows = "";
  if (m.sizes) {
    rows = `<div class="mi-row"><span class="mi-name">${esc(name)}</span><span class="mi-dots" style="border:0"></span></div>`;
    rows += m.sizes.map(([sz, p]) => `
      <div class="mi-size"><span class="sz">· ${esc(trSz(sz))}</span><span class="mi-dots"></span><span class="mi-price">${won(p)}</span></div>`).join("");
  } else {
    const priceHtml = m.p == null ? `<span class="mi-price" style="color:var(--ink-faint)">—</span>` : `<span class="mi-price">${won(m.p)}</span>`;
    rows = `<div class="mi-row"><span class="mi-name">${esc(name)}</span><span class="mi-dots"></span>${priceHtml}</div>`;
  }
  const koLine = lang !== "ko" ? `<div class="mi-ko">${esc(m.ko)}</div>` : "";
  const tagLine = m.tag ? `<div class="mi-tag">${esc(m.tag[lang] || m.tag.ko)}</div>` : "";
  return `<div class="mi">${rows}${koLine}${tagLine}</div>`;
}

function renderIndex() {
  const u = t();
  const shopCards = SHOPS.map((s) => `
    <a class="shopcard" href="${LINKS[s.id]}">
      <span class="sc-body">
        <span class="sc-name">${esc(lang === "ko" ? s.name : s.name + " · " + s.rom)}</span>
        <span class="sc-cat">${esc(s.cat[lang])}</span>
      </span>
      <span class="sc-arrow">›</span>
    </a>`).join("");

  const qrCards = SHOPS.map((s) => `
    <div class="qr-sticker">
      ${QR[s.id] ? `<img src="${QR[s.id]}" alt="QR ${esc(s.name)}">` : `<div class="qr-ph">QR</div>`}
      <div class="qr-name">${esc(s.name)}</div>
      <div class="qr-hint">${esc(u.scan)}</div>
    </div>`).join("");

  const howSteps = u.how.map((h, i) => `
    <div class="how-step">
      <span class="hs-n">${i + 1}</span>
      <span class="hs-t"><b>${esc(h[0])}</b><span>${esc(h[1])}</span></span>
    </div>`).join("");

  return `
    <div class="masthead">
      <div class="mk-sub">${esc(u.kicker)}</div>
      <h1 class="serif">${esc(u.market)}</h1>
      <div class="mk-en">${esc(u.marketSub)}</div>
    </div>
    <div class="mast-rule">✦</div>
    <p class="lead">${esc(u.lead)}</p>

    <div class="sechead"><span class="no">壹</span>${esc(u.shops)}</div>
    ${shopCards}

    ${Object.keys(QR).length ? `<div class="sechead"><span class="no">貳</span>${esc(u.qrSec)}</div>
    <div class="qr-grid">${qrCards}</div>
    <p class="qr-note">${esc(u.qrNote)}</p>` : ""}

    <div class="sechead"><span class="no">參</span>${esc(u.howSec)}</div>
    <div class="how">${howSteps}</div>

    ${footerHtml()}
  `;
}

function renderShop(shop) {
  const u = t();
  const sectionsHtml = shop.sections.map((sec) => `
    <div class="menu-title">${esc(trSec(sec.t))}</div>
    ${sec.items.map(itemHtml).join("")}
  `).join("");

  const notes = (shop.notes[lang] || []).map((n) => `<li>${esc(n)}</li>`).join("");

  return `
    <a class="backlink" href="#/">‹ ${esc(u.back)}</a>
    <div class="shop-head">
      <h1 class="serif">${esc(shop.name)}</h1>
      <div class="sh-alt">${esc(shop.rom)}</div>
      <span class="sh-cat">${esc(shop.cat[lang])}</span>
    </div>

    <div class="menu-paper">
      ${sectionsHtml}
      ${notes ? `<ul class="paper-notes">${notes}</ul>` : ""}
      ${lang !== "ko" && u.orderHint ? `<div class="order-hint">👉 ${esc(u.orderHint)}</div>` : ""}
    </div>

    ${footerHtml(true)}
  `;
}

function footerHtml(withPrice) {
  const u = t();
  return `<footer>
    ${withPrice ? esc(u.priceNote) + "<br>" : ""}
    ${esc(u.updated)}<br>
    <span class="f-market">${esc(u.market)}</span>
  </footer>`;
}

function render() {
  const u = t();
  document.getElementById("demoRibbon").textContent = "⚠ " + u.demo;
  renderLangbar();
  document.getElementById("app").innerHTML = renderIndex();
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", render);
document.documentElement.setAttribute("lang", lang);
render();
</script>
</body>
</html>
